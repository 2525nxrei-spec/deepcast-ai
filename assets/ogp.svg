<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装飾 -->
  <circle cx="150" cy="500" r="250" fill="#e94560" opacity="0.05"/>
  <circle cx="1050" cy="130" r="280" fill="#e94560" opacity="0.04"/>
  <!-- マイクアイコン -->
  <g transform="translate(600, 185)">
    <!-- マイク本体 -->
    <rect x="-16" y="-50" width="32" height="55" rx="16" fill="none" stroke="#e94560" stroke-width="4"/>
    <!-- マイクスタンドのU字 -->
    <path d="M-30,0 Q-30,35 0,35 Q30,35 30,0" fill="none" stroke="#e94560" stroke-width="4"/>
    <!-- スタンド棒 -->
    <line x1="0" y1="35" x2="0" y2="55" stroke="#e94560" stroke-width="4"/>
    <!-- スタンド台 -->
    <line x1="-18" y1="55" x2="18" y2="55" stroke="#e94560" stroke-width="4" stroke-linecap="round"/>
    <!-- 音波 -->
    <path d="M40,-20 Q55,-5 40,15" fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.6"/>
    <path d="M50,-30 Q72,-5 50,25" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
    <path d="M-40,-20 Q-55,-5 -40,15" fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.6"/>
    <path d="M-50,-30 Q-72,-5 -50,25" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- サービス名 -->
  <text x="600" y="340" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="76" font-weight="bold" fill="url(#accent)" letter-spacing="6">DeepCast AI</text>
  <!-- キャッチコピー -->
  <text x="600" y="410" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="28" fill="#c8c8d0">AI・テック動向を耳だけでキャッチアップ</text>
  <!-- 下部ライン -->
  <rect x="480" y="460" width="240" height="3" rx="2" fill="#e94560" opacity="0.4"/>
  <!-- 会社名 -->
  <text x="600" y="560" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif" font-size="18" fill="#c8c8d0" opacity="0.5">株式会社 礼</text>
</svg>