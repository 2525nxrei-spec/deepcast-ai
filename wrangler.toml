# ============================================================
# DeepCast AI — Cloudflare Pages 設定
# ============================================================

name = "deepcast-ai"
pages_build_output_dir = "."
compatibility_date = "2024-12-01"

# ============================================================
# D1 データベースバインディング
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "deepcast-db"
database_id = "a932458d-de69-4dad-a777-e1a2ceeee840"

# ============================================================
# 環境変数
# ============================================================
[vars]
FRONTEND_URL = "https://deepcast-ai.com"
# STRIPE_PRICE_PRO は Cloudflare ダッシュボードまたは wrangler pages secret put で設定

# 以下はシークレットとして設定（wrangler pages secret put コマンド使用）
# wrangler pages secret put STRIPE_SECRET_KEY
# wrangler pages secret put STRIPE_WEBHOOK_SECRET
# wrangler pages secret put JWT_SECRET（設定済み）
# wrangler pages secret put STRIPE_PRICE_PRO

# ============================================================
# 開発環境
# ============================================================
[dev]
port = 8788
