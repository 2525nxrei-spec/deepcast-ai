<html lang="ja">
<head>

  <meta charset="UTF-8">

  <title>ログイン - DeepCast AI</title>
  <meta name="description" content="DeepCast AIのログイン・新規登録ページです。メールアドレスで簡単にアカウントを作成し、AIが毎日生成する高品質ポッドキャストをお楽しみください。無料プランでも毎日の最新エピソードを視聴可能。Proプランにアップグレードすれば全エピソード聴き放題です。">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="ログイン - DeepCast AI">
  <meta property="og:description" content="DeepCast AIのログイン・新規登録ページです。アカウントを作成してAIポッドキャストの全エピソードを楽しもう。無料プランでも毎日の最新エピソードを視聴できます。">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://deepcast-ai.com/assets/og-image.png">

  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ログイン - DeepCast AI">
  <meta name="twitter:description" content="DeepCast AIのログイン・新規登録ページです。アカウントを作成してAIポッドキャストの全エピソードを楽しもう。">
  <meta name="twitter:image" content="https://deepcast-ai.com/assets/og-image.png">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/icon.svg">
  <link rel="stylesheet" href="../css/style.css?v=20260327">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo a {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }
    .login-logo .logo-ai {
      font-family: var(--sans);
      font-weight: 400;
      color: var(--text-muted);
      font-size: 16px;
      margin-left: 3px;
    }
    .login-title {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }
    .login-tabs {
      display: flex;
      margin-bottom: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }
    .login-tab {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 0;
      cursor: pointer;
      background: #fff;
      color: var(--text-muted);
      border: none;
      font-family: var(--sans);
      transition: background 0.15s, color 0.15s;
    }
    .login-tab.is-active {
      background: var(--green);
      color: #fff;
    }
    .login-field {
      margin-bottom: 14px;
    }
    .login-field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .login-field input {
      width: 100%;
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      outline: none;
      background: var(--bg-alt);
      transition: border-color 0.2s;
    }
    .login-field input:focus {
      border-color: var(--green);
    }
    .login-submit {
      width: 100%;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 12px 0;
      border: none;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-submit:hover { opacity: 0.85; }
    .login-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error {
      font-size: 12px;
      color: #dc2626;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
    .login-toggle {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
    }
    .login-toggle a {
      color: var(--green);
      font-weight: 500;
      cursor: pointer;
    }
    .login-back {
      display: block;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .login-back:hover { color: var(--text); }
    /* スピナー */
    @keyframes btnSpinner {
      to { transform: rotate(360deg); }
    }
    .btn-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }
    .btn-loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 18px; height: 18px;
      margin: -9px 0 0 -9px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: btnSpinner 0.6s linear infinite;
    }
    /* :active フィードバック */
    .login-submit:active,
    .login-tab:active {
      transform: scale(0.97);
      opacity: 0.8;
    }
    /* :focus-visible */
    .login-submit:focus-visible,
    .login-tab:focus-visible,
    .login-field input:focus-visible,
    .login-back:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <a href="../">DeepCast<span class="logo-ai">AI</span></a>
      </div>
      <div class="login-title" id="login-title">ログイン</div>
      <div class="login-sub" id="login-sub">メールアドレスとパスワードを入力</div>
      <div class="login-tabs" role="tablist">
        <button class="login-tab" id="tab-login" role="tab" aria-selected="true">ログイン</button>
        <button class="login-tab" id="tab-register" role="tab" aria-selected="false">新規登録</button>
      </div>
      <form id="login-form">
        <div class="login-field">
          <label for="input-email">メールアドレス</label>
          <input type="email" id="input-email" placeholder="you@example.com" required>
        </div>
        <div class="login-field">
          <label for="input-password">パスワード（8文字以上）</label>
          <input type="password" id="input-password" placeholder="8文字以上" minlength="8" required>
        </div>
        <div class="login-field" id="field-terms" style="display:none;">
          <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;cursor:pointer;">
            <input type="checkbox" id="input-terms" style="margin-top:3px;flex-shrink:0;">
            <span><a href="../terms.html" target="_blank" style="color:var(--green);text-decoration:underline;">利用規約</a>と<a href="../privacy.html" target="_blank" style="color:var(--green);text-decoration:underline;">プライバシーポリシー</a>に同意する</span>
          </label>
        </div>
        <div id="pw-strength-reg" style="font-size:11px;color:var(--text-muted);margin-bottom:8px;display:none;"></div>
        <button type="submit" class="login-submit" id="login-submit-btn">ログイン</button>
        <div class="login-error" id="login-error"></div>
        <p style="text-align:center;margin-top:10px;font-size:12px;color:var(--text-muted);">パスワードをお忘れの方は <a href="../contact.html" style="color:var(--green);text-decoration:underline;">お問い合わせ</a>ください</p>
      </form>
      <div class="login-toggle" id="login-toggle">
        アカウントをお持ちでない方は<a id="toggle-link">新規登録</a>
      </div>
      <a href="../" class="login-back">&larr; トップに戻る</a>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 既にログイン済みならリダイレクト
      if (typeof DEEPCAST_AUTH !== 'undefined' && DEEPCAST_AUTH.isLoggedIn()) {
        var returnUrl = new URLSearchParams(window.location.search).get('return');
        // セキュリティ: 同一オリジンの相対パスのみ許可（オープンリダイレクト防止）
        if (returnUrl && (/^\/[^\/\\]/.test(returnUrl) || returnUrl === '/')) {
          window.location.href = returnUrl;
        } else {
          window.location.href = '../';
        }
        return; // リダイレクト後の後続コード実行を防止
      }

      var loginForm = document.getElementById('login-form');
      var loginError = document.getElementById('login-error');
      var loginTitle = document.getElementById('login-title');
      var loginSub = document.getElementById('login-sub');
      var loginSubmitBtn = document.getElementById('login-submit-btn');
      var tabLogin = document.getElementById('tab-login');
      var tabRegister = document.getElementById('tab-register');
      var toggleLink = document.getElementById('toggle-link');
      var loginToggle = document.getElementById('login-toggle');

      var mode = 'login';
      var fieldTerms = document.getElementById('field-terms');
      var pwStrengthReg = document.getElementById('pw-strength-reg');

      // パスワード強度チェック（リアルタイム）
      document.getElementById('input-password').addEventListener('input', function() {
        if (mode !== 'register') return;
        var pw = this.value;
        var el = pwStrengthReg;
        if (pw.length === 0) { el.textContent = ''; }
        else if (pw.length < 8) { el.textContent = 'あと' + (8 - pw.length) + '文字必要です'; el.style.color = '#dc2626'; }
        else if (!/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw)) { el.textContent = '英字と数字の両方を含めてください'; el.style.color = '#d97706'; }
        else { el.textContent = 'OK'; el.style.color = '#16a34a'; }
      });

      // 初期状態: ログインタブをアクティブ
      tabLogin.classList.add('is-active');

      function setMode(m) {
        mode = m;
        if (mode === 'login') {
          tabLogin.classList.add('is-active');
          tabRegister.classList.remove('is-active');
          loginTitle.textContent = 'ログイン';
          loginSub.textContent = 'メールアドレスとパスワードを入力';
          loginSubmitBtn.textContent = 'ログイン';
          loginToggle.innerHTML = 'アカウントをお持ちでない方は<a id="toggle-link">新規登録</a>';
          if (fieldTerms) fieldTerms.style.display = 'none';
          if (pwStrengthReg) pwStrengthReg.style.display = 'none';
        } else {
          tabRegister.classList.add('is-active');
          tabLogin.classList.remove('is-active');
          loginTitle.textContent = '新規登録';
          loginSub.textContent = 'メールアドレスとパスワードで登録';
          loginSubmitBtn.textContent = '新規登録';
          loginToggle.innerHTML = '既にアカウントをお持ちの方は<a id="toggle-link">ログイン</a>';
          if (fieldTerms) fieldTerms.style.display = 'block';
          if (pwStrengthReg) pwStrengthReg.style.display = 'block';
        }
        document.getElementById('toggle-link').addEventListener('click', function() {
          setMode(mode === 'login' ? 'register' : 'login');
        });
        loginError.style.display = 'none';
      }

      // ページ読み込み時にボタンを確実に有効化（ブラウザの状態復元対策）
      loginSubmitBtn.disabled = false;
      loginSubmitBtn.classList.remove('btn-loading');

      tabLogin.addEventListener('click', function() { setMode('login'); });
      tabRegister.addEventListener('click', function() { setMode('register'); });
      toggleLink.addEventListener('click', function() { setMode('register'); });

      loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        // 二重クリック防止
        if (loginSubmitBtn.disabled) return;
        loginError.style.display = 'none';
        loginSubmitBtn.disabled = true;
        var origText = loginSubmitBtn.textContent;
        loginSubmitBtn.classList.add('btn-loading');

        try {
          var email = document.getElementById('input-email').value;
          var password = document.getElementById('input-password').value;

          if (typeof DEEPCAST_AUTH === 'undefined') {
            throw new Error('認証システムの読み込みに失敗しました。ページを再読み込みしてください。');
          }

          if (mode === 'register') {
            if (password.length < 8) { throw new Error('パスワードは8文字以上で入力してください'); }
            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) { throw new Error('パスワードは英字と数字の両方を含めてください'); }
            var termsCheck = document.getElementById('input-terms');
            if (termsCheck && !termsCheck.checked) { throw new Error('利用規約への同意が必要です'); }
            await DEEPCAST_AUTH.register(email, password);
          } else {
            await DEEPCAST_AUTH.login(email, password);
          }

          // 成功 → チェックマーク表示 → 元のページまたはトップへ
          loginSubmitBtn.classList.remove('btn-loading');
          loginSubmitBtn.innerHTML = '&#10003;';
          loginSubmitBtn.style.background = '#16a34a';
          await new Promise(function(r) { setTimeout(r, 600); });
          var returnUrl = new URLSearchParams(window.location.search).get('return');
          // セキュリティ: 同一オリジンの相対パスのみ許可（オープンリダイレクト防止）
          if (returnUrl && (/^\/[^\/\\]/.test(returnUrl) || returnUrl === '/')) {
            window.location.href = returnUrl;
          } else {
            window.location.href = '../';
          }
        } catch (err) {
          // エラーメッセージを親切に変換
          var msg = err.message || '';
          if (msg.includes('network') || msg.includes('fetch') || msg.includes('Failed to fetch')) {
            msg = 'インターネット接続を確認してください。接続に問題がない場合は、しばらく時間をおいて再度お試しください。';
          } else if (msg.includes('Invalid') || msg.includes('invalid') || msg.includes('credentials')) {
            msg = 'メールアドレスまたはパスワードが正しくありません。入力内容を確認してください。';
          } else if (msg.includes('already') || msg.includes('duplicate') || msg.includes('exists')) {
            msg = 'このメールアドレスは既に登録されています。ログインをお試しください。';
          }
          loginError.textContent = msg;
          loginError.style.display = 'block';
          loginSubmitBtn.disabled = false;
          loginSubmitBtn.classList.remove('btn-loading');
          loginSubmitBtn.textContent = origText;
        }
      });
    });
  </script>
</body>
</html>
